name: Reusable Ci
on:
    workflow_call:
        inputs:
            image_name: 
                required: true
                type: string
            registry: 
                required: true
                type: string
                default: guruhbk
            context:
                required: true
                type: string
                default: .
            docker_path:
                required: true
                type: string
                default: .
            image_tag: 
                required: true
                type: string
                default: latest
            push_image:
                required: true
                type: boolean
                default: true

        secrets:
            registry_username: 
                required: true
            registry_password: 
                required: true
jobs: 
    docker-build:
        runs-on: ubuntu-latest
        permissions: 
            contents: read
            packages: write
        outputs: 
            image: ${{steps.meta.outputs.image}}
        
        steps:
            - name: checkout repository
              uses: actions/checkout@v4
            - name: set image
              id: meta 
              run: |
                IMAGE="${{inputs.registry}}/${{inputs.image_name}}:${{inputs.image_tag}}"
                echo "image=$IMAGE" >> $GITHUB_OUTPUT
            - name: setup docker buildx
              uses: docker/setup-buildx-action@v3
            - name: login to registry
              uses: docker/build-push-action@v6
              with:
                context: ${{inputs.context}}
                file: ${{inputs.docker_path}}
                push: ${{inputs.push_image}}
                tags: ${{steps.meta.outputs.image}}
                cache-from: type=gha
                cache-to: type=gha,mode=max




            
        